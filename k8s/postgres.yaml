apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: secureflow-postgres
  namespace: secureflow
spec:
  serviceName: secureflow-postgres
  replicas: 1
  selector:
    matchLabels:
      app: secureflow-postgres
  template:
    metadata:
      labels:
        app: secureflow-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "secureflow_db"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: secureflow-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secureflow-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: secureflow-postgres
  namespace: secureflow
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: secureflow-postgres
  type: ClusterIP
