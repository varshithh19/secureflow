apiVersion: v1
kind: Service
metadata:
  name: secureflow-service
  namespace: secureflow
  labels:
    app: secureflow-app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: secureflow-app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secureflow-ingress
  namespace: secureflow
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  rules:
    - host: secureflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: secureflow-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: secureflow
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-app
  namespace: secureflow
spec:
  podSelector:
    matchLabels:
      app: secureflow-app
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow PostgreSQL database traffic
    - to:
        - podSelector:
            matchLabels:
              app: secureflow-postgres
      ports:
        - protocol: TCP
          port: 5432
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secureflow-hpa
  namespace: secureflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secureflow-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
