# Example placeholder secret for Kubernetes deployment
# DO NOT commit production secrets. Use Vault, SealedSecrets, or ExternalSecrets in production.
apiVersion: v1
kind: Secret
metadata:
  name: secureflow-secrets
  namespace: secureflow
type: Opaque
stringData:
  SECRET_KEY: "replace_with_a_secure_random_64_character_hex_key_for_production"
  JWT_SECRET_KEY: "replace_with_a_secure_jwt_signing_key_for_production"
  CONTROLLER_SIGNING_KEY: "replace_with_a_secure_controller_hmac_key_for_production"
  DATABASE_URL: "postgresql://secureflow_user:secureflow_password@secureflow-postgres:5432/secureflow_db"
  POSTGRES_USER: "secureflow_user"
  POSTGRES_PASSWORD: "secureflow_password"
